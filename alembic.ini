[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is supplied by db/migrations/env.py from DATABASE_URL (the
# owner role). The application connects as DATABASE_URL_APP, which is subject
# to row-level security; migrations are not.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
