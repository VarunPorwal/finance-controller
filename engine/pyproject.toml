[project]
name = "fc-engine"
version = "0.1.0"
description = "AI Finance Controller — pure domain engine. No FastAPI, no SQLAlchemy, no network."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

# The dependency list above is the enforcement mechanism for the architectural
# rule "engine/ imports nothing from api/ or db/" (PRD §3.7). sqlalchemy and
# fastapi are not resolvable from this package, so the import cannot be written.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fc"]
