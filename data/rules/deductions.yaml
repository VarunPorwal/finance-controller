# --- statutory, batch-level -------------------------------------------------
#
# TDS 194-O applies to gross sales through an e-commerce operator, deducted
# once per settlement regardless of how many transactions or methods make it
# up (unlike MDR, which is per-transaction because the rate depends on how
# the customer paid). Scoped to `source: razorpay` only, with no `method`
# clause — `fc.pipeline._own_store_tds_gaps` is the only caller that ever
# feeds this rule to `apply_rules`, passing it alone rather than alongside
# the `razorpay_mdr_*` rules, so it is never a candidate for a per-transaction
# gap even though its scope alone would not rule that out (§6.7's
# `candidates()` has no field for "this row is an adjustment, not a
# payment" — the isolation is enforced by which rules the caller selects,
# not by scope). Marketplace settlements verify their own TDS inside their
# commission rule and are excluded by the caller before this rule is ever
# reached, so a payout is never checked twice.

- id: razorpay_tds_batch
  version: 1
  name: Razorpay TDS 194-O — settlement batch
  description: >-
    1% TDS under section 194-O on gross, deducted once per settlement.
    Own-store only: a marketplace settlement's TDS is verified as part of its
    own commission rule (blinkit_commission / zepto_commission), and checking
    it again here would be the same finding twice — the caller
    (fc.pipeline._own_store_tds_gaps) excludes marketplace settlements before
    this rule is ever applied.
  scope:
    source: razorpay
    date_from: 2026-04-01
  deductions:
    - type: tds_194o
      basis: gross
      rate: 1.0
  tolerance:
    absolute_paise: 100
    percent: 0.05
  priority: 100
  effective_confidence: 0.95
  origin: manual
  created_by: system:starter_pack

# --- marketplace, the reason the Rulebook exists (PRD §0.3) ---------------
#
# "Whenever it's Blinkit, expect 18% commission plus 18% GST on that fee plus
# 1% TDS." A named counterparty with its own commission structure is what makes
# these real rules rather than contrived examples.
#
# Priority 200: when a marketplace rule and a generic MDR rule both match a row,
# the platform's own commercial terms win. Specificity would order these first
# anyway; the explicit priority says it on purpose rather than by accident.

- id: blinkit_commission
  version: 3
  name: Blinkit commission
  description: >-
    18% platform commission on gross, 18% GST on that commission, 1% TDS 194-O
    on gross. Settles weekly, so a payout is one rate across many orders and the
    batch is the right unit to apply this to. Tolerance is ₹5 rather than ₹1
    because the platform computes per order and rounds each one, so a rate
    applied to the batch total misses by a paise per order per line.
  scope:
    counterparty_matches: [BLINKIT]
    date_from: 2026-04-01
  deductions:
    - type: commission
      basis: gross
      rate: 18.0
    - type: gst_on_fee
      basis: commission
      rate: 18.0
    - type: tds_194o
      basis: gross
      rate: 1.0
  tolerance:
    absolute_paise: 500
    percent: 0.05
  priority: 200
  effective_confidence: 0.95
  origin: manual
  created_by: system:starter_pack

- id: zepto_commission
  version: 1
  name: Zepto commission
  description: >-
    Same structure as Blinkit at the same headline rate. Written as a separate
    rule rather than one rule naming both platforms: the rates are equal today
    and there is no reason to believe they stay equal, and a rate change on one
    platform must not require editing the other's rule.
  scope:
    counterparty_matches: [ZEPTO]
    date_from: 2026-04-01
  deductions:
    - type: commission
      basis: gross
      rate: 18.0
    - type: gst_on_fee
      basis: commission
      rate: 18.0
    - type: tds_194o
      basis: gross
      rate: 1.0
  tolerance:
    absolute_paise: 500
    percent: 0.05
  priority: 200
  effective_confidence: 0.95
  origin: manual
  created_by: system:starter_pack
