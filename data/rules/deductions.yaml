- id: razorpay_mdr_upi
  version: 1
  name: Razorpay MDR — UPI
  description: >-
    UPI carries no MDR, but TDS 194-O still applies to the gross. The zero-rate
    MDR and GST lines are stated rather than omitted so the stack a human reads
    matches the stack the other methods produce, and so a future UPI MDR is a
    rate change rather than a schema change.
  scope:
    source: razorpay
    method: upi
    date_from: 2026-04-01
  deductions:
    - type: mdr
      basis: gross
      rate: 0.0
    - type: gst_on_fee
      basis: mdr
      rate: 18.0
    - type: tds_194o
      basis: gross
      rate: 1.0
  tolerance:
    absolute_paise: 100
    percent: 0.05
  priority: 100
  effective_confidence: 0.95
  origin: manual
  created_by: system:starter_pack

