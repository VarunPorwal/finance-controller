# Deduction Rulebook — starter pack. PRD Appendix D, §0.3, §4.1.7.
#
# Loaded by fc.rules.loader.load_rules. Every field here is Appendix D's schema;
# `rate` and `tolerance.percent` are PERCENTAGES (18 means 18%, 0.05 means
# 0.05%), and every money field is integer paise.
#
# Two families, and they apply at different granularities on purpose:
#
#   * The `razorpay_mdr_*` rules are scoped `source: razorpay` + `method:`, so
#     they match one payment row. MDR is charged per transaction at a rate that
#     depends on how the customer paid, and a settlement batch mixes methods —
#     there is no single MDR rate for a batch, so there is no batch-level rule.
#   * The marketplace rules are scoped by counterparty and match the settlement
#     leg (the bank credit or the Tally receipt, which are the rows that carry
#     BLINKIT/ZEPTO as the party). A platform commission is one rate across the
#     whole weekly payout, so the batch is the right unit.
#
# Order within `deductions` is significant: bases chain, and `gst_on_fee` reads
# the `mdr`/`commission` line above it. Swapping two lines is a different rule.
#
# `date_from: 2026-04-01` is the start of the Indian fiscal year these rates
# belong to. Effective dating is real — a June reconciliation replays against
# June's rates after a July change, and a rule dated 1 April does not touch a
# 15 March transaction.
#
# Rules are immutable per version. To change a rate, add a version N+1 entry
# with its own date window; do not edit one of these in place (§4.3.6 enforces
# it in the database, and this file is the thing that database mirrors).

- id: razorpay_mdr_card
  version: 1
  name: Razorpay MDR — card
  description: >-
    2% MDR on card payments, 18% GST on that MDR, 1% TDS under section 194-O on
    the gross. PRD §4.1.7.
  scope:
    source: razorpay
    method: card
    date_from: 2026-04-01
  deductions:
    - type: mdr
      basis: gross
      rate: 2.0
    - type: gst_on_fee
      basis: mdr
      rate: 18.0
    - type: tds_194o
      basis: gross
      rate: 1.0
  tolerance:
    absolute_paise: 100
    percent: 0.05
  priority: 100
  effective_confidence: 0.95
  origin: manual
  created_by: system:starter_pack

