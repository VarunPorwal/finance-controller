# `aliases` are matched after fc.ingest.aliases normalise_counterparty's
# normalisation (uppercase, rail-prefix strip, punctuation strip, whitespace
# collapse) — so list aliases in roughly the form a bank or Tally narration
# would actually carry them, not hand-pre-cleaned.

