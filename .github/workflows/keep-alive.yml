name: Keep API alive

# Two things go to sleep when nobody is looking. Render's free plan spins the
# web service down after about 15 minutes idle. Neon suspends the database
# compute after 5 minutes idle. The in-process scheduler cannot help with
# either; it sleeps when Render sleeps. So this is the external pinger.
#
# Every 5 minutes (the smallest interval GitHub allows) it hits /health, which
# wakes Render, and /health/ready, which opens a database connection and wakes
# Neon. A cold Render instance takes 30 to 60 seconds to answer, so the first
# attempt is allowed to time out and a second attempt follows; the first
# request already started the wake-up even when it times out.
#
# GitHub runs scheduled workflows on a best-effort basis and can be minutes
# late at busy times. That is why the interval is 5 and not 10: two late
# 10-minute pings in a row cross Render's idle limit; two late 5-minute pings
# do not.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

env:
  API: https://finance-controller-api-09yw.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the API and the database
        run: |
          ping() {
            local path="$1"
            local code
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API$path" || true)
              echo "$path attempt $attempt: $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            echo "::warning::$path did not return 200 after 3 attempts (last: $code)"
            return 0
          }
          ping /health
          ping /health/ready
