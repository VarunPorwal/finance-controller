[project]
name = "finance-controller"
version = "0.1.0"
description = "AI Finance Controller — API, persistence and migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fc-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11.3",
    "resend>=2.42.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
fc-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: accuracy suite, excluded from the default run"]
addopts = "-m 'not eval'"

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true

# Ships no py.typed marker / stubs; only used from api/scheduler.py, never
# from anything mypy --strict engine/src actually gates.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# The PRD is the specification, not source. Ruff must not touch its code blocks.
extend-exclude = ["docs", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(fn)` — the
# call in the default is how the framework recognises a dependency, not a
# mutable-default footgun (B008's actual concern), so it is universal in
# every router and would be noise as a per-line noqa in each one.
"api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fc", "api", "db"]
